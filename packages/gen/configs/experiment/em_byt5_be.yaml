# @package _global_

# Text-conditioned latent energy matching on the Bernese corpus:
#   uv run gen-train experiment=em_be
#   uv run gen-train experiment=em_be model.cd_weight=0                 # phase 1 only
#   uv run gen-train experiment=em_be model/text_encoder=byt5
# Phase 1 (OT) runs for model.cd_start_step steps, phase 2 (OT + CD) for the rest.
defaults:
  - override /data: be_latent_text
  - override /model: em
  - override /sampling: em
  - override /logger: wandb
  - override /model/text_encoder: byt5

run_name: em_be
tags: ["be", "energy_matching", "latent", "cross_attention"]

monitor: val/ot

vae_ckpt: ${paths.root_dir}/logs/train_vae/vae_be/runs/2026-10-14_15-06-48_151548/checkpoints/best.pt

trainer:
  max_steps: 100000
  warmup_steps: 2000
  val_every_n_steps: 2000
  ckpt_every_n_steps: 2000
  n_audio_samples: 3
  audio_every_n_vals: 1
