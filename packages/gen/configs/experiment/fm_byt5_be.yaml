# @package _global_

# Text-conditioned latent flow matching on the Bernese corpus:
#   uv run gen-train experiment=fm_be
#   uv run gen-train experiment=fm_be model/text_encoder=byt5
defaults:
  - override /data: be_latent_text
  - override /model: fm
  - override /logger: wandb
  - override /model/text_encoder: byt5

run_name: fm_be
tags: ["be", "flow_matching", "latent", "cross_attention"]

# The 50k-step VAE from 2026-10-14 (val L1 0.088). Needs fitted latent statistics.
vae_ckpt: ${paths.root_dir}/logs/train_vae/vae_be/runs/2026-10-14_15-06-48_151548/checkpoints/best.pt

trainer:
  max_steps: 100000
  warmup_steps: 2000
  val_every_n_steps: 2000
  ckpt_every_n_steps: 2000
  n_audio_samples: 3
  audio_every_n_vals: 1
