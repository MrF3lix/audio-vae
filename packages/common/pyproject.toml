[project]
name = "common"
version = "0.1.0"
description = "Shared tooling: mel front-end, vocoder wrapper, filelists, training loop, loggers, hydra config groups"
requires-python = ">=3.12"
dependencies = [
    "hydra-colorlog>=1.2.0",
    "hydra-core>=1.3.7",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "rootutils>=1.0.7",
    "soundfile>=0.14.0",
    "torch>=2.8.0,<2.12",
    "torchaudio>=2.8.0,<2.12",
    "tqdm",
    "transformers>=4.57,<5",
    "wandb>=0.30.0",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
