[project]
name = "vae"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hydra-colorlog>=1.2.0",
    "hydra-core>=1.3.7",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "rootutils>=1.0.7",
    "soundfile>=0.14.0",
    "torch>=2.14.1",
    "torchaudio>=2.11.0",
    "transformers>=5.19.0",
    "wandb>=0.30.0",
]

[project.optional-dependencies]
cu128 = ["torch==2.8.0", "torchaudio==2.8.0"]
rocm = [
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "triton-rocm; platform_machine == 'x86_64' and sys_platform == 'linux'",
]
wandb = ["wandb"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", extra = "cu128" },
    { index = "pytorch-rocm", extra = "rocm" },
]
torchaudio = [
    { index = "pytorch-cu128", extra = "cu128" },
    { index = "pytorch-rocm", extra = "rocm" },
]

triton-rocm = [{ index = "pytorch-rocm", extra = "rocm" }]

[tool.uv]
conflicts = [[{ extra = "cu128" }, { extra = "rocm" }]]


[project.scripts]

vae-train = "vae.train:main"
vae-latent-stats = "vae.cli.vae_latent_stats:main"


[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
