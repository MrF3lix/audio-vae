# Workspace root: not a package itself, it only ties the members together and owns the
# accelerator extras (cu128 / rocm), so `uv sync --extra cu128` installs every member against
# the right torch build.
[project]
name = "audio-workspace"
version = "0.1.0"
description = "Audio VAE, latent generative models and shared tooling"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["common", "vae", "gen"]

[project.optional-dependencies]
cu128 = ["torch==2.8.0", "torchaudio==2.8.0"]
rocm = [
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "triton-rocm; platform_machine == 'x86_64' and sys_platform == 'linux'",
]
wandb = ["wandb"]

[tool.uv]
package = false
conflicts = [[{ extra = "cu128" }, { extra = "rocm" }]]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
common = { workspace = true }
vae = { workspace = true }
gen = { workspace = true }
torch = [
    { index = "pytorch-cu128", extra = "cu128" },
    { index = "pytorch-rocm", extra = "rocm" },
]
torchaudio = [
    { index = "pytorch-cu128", extra = "cu128" },
    { index = "pytorch-rocm", extra = "rocm" },
]
triton-rocm = [{ index = "pytorch-rocm", extra = "rocm" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true
