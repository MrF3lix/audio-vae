[project]
name = "vae"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hydra-colorlog>=1.2.0",
    "hydra-core>=1.3.7",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "rootutils>=1.0.7",
    "soundfile>=0.14.0",
    "torch>=2.14.1",
    "torchaudio>=2.11.0",
    "transformers>=5.19.0",
    "wandb>=0.30.0",
]


[project.scripts]

vae-train = "vae.train:main"


[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
